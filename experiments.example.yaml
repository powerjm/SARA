# Example experiment matrix.
#
# Used by `sara batch --config experiments.example.yaml`.
# Copy to experiments.yaml and edit for your run plan; experiments.yaml is
# gitignored to prevent committing API keys or in-progress matrices.

# How many independent runs per (binary, backend, strategy) cell.
# Higher absorbs more backend stochasticity; multiplies total cost linearly.
# Decided (Step 5): 5 replicates — tighter Wilson intervals and steadier medians.
replicates: 5

# Per-run hard caps plus the per-backend cost partition.
limits:
  # Per individual run. The harness aborts the run when either trips
  # (-> Outcome.FAILURE / FailureMode.BUDGET_EXHAUSTED). Set generously: local
  # LM Studio models are slow and free, so give them room to iterate; premium
  # models are separately bounded by usd_per_backend below, so a large cap here
  # does NOT let them overspend (they hit their dollar cap first).
  tokens: 1000000
  wall_clock_seconds: 600

  # Reason rounds and "you must call a tool" nudges per run (ADR 0012). Raised
  # from the defaults (8 / 2) so slower open models get more attempts to build a
  # working chain before the run is cut. Applies to all backends.
  max_iterations: 16
  max_nudges: 3

  # Cost cap is partitioned PER BACKEND (Step-5 decision): each backend gets its
  # own USD budget so a pricey premium model can't starve the cheaper ones. Once
  # a backend's cumulative spend (this batch + spend already on disk) reaches its
  # cap, its remaining cells are halted while the others continue. Omit a backend
  # (or set 0) for no cap.
  usd_per_backend:
    # Only the priced PREMIUM (hosted) backends need a cap; the local LM Studio
    # models record usd=0.0 and are uncapped. The values below cover the
    # `sara batch --dry-run` estimate (10 binaries x 4 strategies x 5 replicates
    # = 200 runs per backend) with headroom — tune before a real run.
    claude-sonnet: 75.0
    claude-opus: 100.0
    gpt-5: 100.0
    gemini-pro-latest: 100.0

# Output directory; gitignored.
output_dir: "./runs"

# Backends to test. Each name must be a registered handle in backends.registry
# (see backends/README.md -> "Quick reference -- --backend handles"). The full
# run-for-record set spans three categories (ADR 0005): PREMIUM hosted frontier
# models, OPEN_WEIGHT local models (alignment intact), and UNRESTRICTED local
# models (alignment removed or absent). Local models are served by LM Studio and
# record usd=0.0; only the PREMIUM backends are priced (and capped above).
backends:
  # --- PREMIUM (hosted API; priced) ---
  - claude-sonnet
  - claude-opus
  - gpt-5
  - gemini-pro-latest
  # --- OPEN_WEIGHT (local LM Studio; alignment intact) ---
  - qwen2.5-coder-32b
  - qwen3-coder-30b
  - gpt-oss-20b
  - devstral-small
  # --- UNRESTRICTED (local LM Studio; alignment removed or absent) ---
  - whiterabbitneo-v3-7b
  - qwen3-30b-abliterated
  - dolphin-3.0-mistral-24b
  # NOTE: qwen2.5-coder-7b is the transport/tool-calling SMOKE-TEST slot, not a
  # run-for-record cell, so it is deliberately omitted. llama-3.3-70b and
  # dolphin-mixtral-8x7b were dropped from the registry (over the 24 GB profile).

# Prompting strategies to test. Names must match keys in agent.prompts.STRATEGIES.
strategies:
  - zero_shot
  - chain_of_thought
  - react
  - majorca

# Binary IDs to test against. Must be an ACTIVE (uncommented) entry in
# corpus/manifest.yaml — i.e. one of the 10 binaries with a verified reference
# shell PoC. The commented-out placeholder/no-PoC entries in the manifest are
# excluded from the corpus and must not be listed here.
binaries:
  # High-leakage arm — DARPA CGC (cb-multios port), each with a verified PoC.
  - cgc-cadet-00001
  - cgc-cromu-00004
  - cgc-eagle-00005
  - cgc-nrfin-00056
  # Low-leakage arm — recent CTF target (BroncoCTF 2026).
  - broncoctf2026-proper-pwning
  # Medium-leakage arm — re-authored ISP RAS synthetic curriculum.
  - ropbench-synth-ex005
  - ropbench-synth-ex002
  - ropbench-synth-ex020
  - ropbench-synth-ex010
  - ropbench-synth-ex101

# Override per-cell config if needed (e.g., a specific binary needs a longer cap).
overrides: {}
  # ropbench-synth-ex101:
  #   limits:
  #     wall_clock_seconds: 3600
