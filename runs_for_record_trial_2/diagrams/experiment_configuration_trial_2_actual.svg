  <text class="sub" x="768" y="137" text-anchor="middle">2 REPLICATES PER CELL → 144 PLANNED RUNS</text>
  <text class="sub" x="768" y="169" text-anchor="middle">96 ATTEMPT DIRECTORIES → 92 FINALIZED + 4 PARTIAL</text>
  <text class="sub" x="768" y="201" text-anchor="middle">48 PLANNED RUNS PRODUCED NO ARCHIVED DIRECTORY</text>

