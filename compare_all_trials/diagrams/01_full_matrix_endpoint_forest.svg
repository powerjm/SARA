<line x1="586.0" y1="175" x2="586.0" y2="530" stroke="#e2e8f0"/>
<text class="axis" x="586.0" y="164" text-anchor="middle">11%</text>
<line x1="792.0" y1="175" x2="792.0" y2="530" stroke="#e2e8f0"/>
<text class="axis" x="792.0" y="164" text-anchor="middle">22%</text>
<line x1="998.0" y1="175" x2="998.0" y2="530" stroke="#e2e8f0"/>
<text class="axis" x="998.0" y="164" text-anchor="middle">33%</text>
<line x1="1204.0" y1="175" x2="1204.0" y2="530" stroke="#e2e8f0"/>
<text class="axis" x="1204.0" y="164" text-anchor="middle">44%</text>
<line x1="1410.0" y1="175" x2="1410.0" y2="530" stroke="#e2e8f0"/>
<text class="axis" x="1410.0" y="164" text-anchor="middle">55%</text>
<text class="label" x="60" y="246">Trial 1</text>
<line x1="380.0" y1="240" x2="384.1" y2="240" stroke="#94a3b8" stroke-width="7"/>
<circle cx="380.0" cy="240" r="12" fill="#172554"/>
<text class="value" x="405.0" y="246">0/1755 = 0.0% [0.00%, 0.22%]</text>
<text class="label" x="60" y="371">Trial 2</text>
<line x1="900.6" y1="365" x2="1263.1" y2="365" stroke="#2563eb" stroke-width="7"/>
<circle cx="1072.1" cy="365" r="12" fill="#172554"/>
<text class="value" x="1097.1" y="371">34/92 = 37.0% [27.80%, 47.16%]</text>
<text class="label" x="60" y="496">Trial 3</text>
<line x1="804.4" y1="490" x2="1078.5" y2="490" stroke="#16a34a" stroke-width="7"/>
<circle cx="931.6" cy="490" r="12" fill="#172554"/>
<text class="value" x="956.6" y="496">43/146 = 29.5% [22.66%, 37.30%]</text>
<rect x="60" y="560" width="1420" height="72" rx="12" fill="#fef3c7"/>
<text class="small" x="84" y="590">Wilson intervals describe run-level sampling only. They do not adjust for clustered replicates, structured attrition,</text>
<text class="small" x="84" y="616">or changes in targets, backends, prompts, tools, schemas, and resource envelopes.</text>
<text class="source" x="60" y="668">Source: finalized record.json outcome metadata</text>
