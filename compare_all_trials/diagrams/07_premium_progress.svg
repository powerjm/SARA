 </style>
<rect width="1600" height="670" fill="#f8fafc"/>
<text class="title" x="60" y="57">Premium-class engagement and success</text>
<text class="sub" x="60" y="103">Each trial’s configured hosted/frontier class; membership changes by trial</text>
<g transform="translate(0,0)">
<line x1="430.0" y1="170" x2="430.0" y2="590" stroke="#e2e8f0"/>
