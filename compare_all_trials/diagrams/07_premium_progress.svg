<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="670" viewBox="0 0 1600 670" role="img">
<title>Premium-class engagement and success</title>
<style>
 .title{font:700 34px system-ui,sans-serif;fill:#172554}
