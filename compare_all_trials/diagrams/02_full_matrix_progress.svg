<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img">
<title>Full-matrix engagement and end-to-end conversion</title>
<style>
 .title{font:700 34px system-ui,sans-serif;fill:#172554}
 .sub{font:17px system-ui,sans-serif;fill:#475569}
 .label{font:650 17px system-ui,sans-serif;fill:#1e293b}
 .small{font:15px system-ui,sans-serif;fill:#64748b}
 .value{font:700 15px system-ui,sans-serif;fill:#172554}
 .legend{font:15px system-ui,sans-serif;fill:#334155}
 .axis{font:14px system-ui,sans-serif;fill:#64748b}
 .white{font:700 15px system-ui,sans-serif;fill:#fff}
 .source{font:14px system-ui,sans-serif;fill:#64748b}
 </style>
<rect width="1600" height="650" fill="#f8fafc"/>
<text class="title" x="60" y="57">Full-matrix engagement and end-to-end conversion</text>
<text class="sub" x="60" y="103">Validator-result prevalence and validator-confirmed marker success</text>
<g transform="translate(0,0)">
<rect x="930" y="120" width="18" height="18" rx="3" fill="#0f766e"/><text class="legend" x="958" y="135">Validator reach</text>
<rect x="1150" y="120" width="18" height="18" rx="3" fill="#16a34a"/><text class="legend" x="1178" y="135">Marker success</text>
<line x1="400.0" y1="170" x2="400.0" y2="570" stroke="#e2e8f0"/>
<text class="axis" x="400.0" y="160" text-anchor="middle">0%</text>
<line x1="602.0" y1="170" x2="602.0" y2="570" stroke="#e2e8f0"/>
<text class="axis" x="602.0" y="160" text-anchor="middle">20%</text>
<line x1="804.0" y1="170" x2="804.0" y2="570" stroke="#e2e8f0"/>
<text class="axis" x="804.0" y="160" text-anchor="middle">40%</text>
<line x1="1006.0" y1="170" x2="1006.0" y2="570" stroke="#e2e8f0"/>
<text class="axis" x="1006.0" y="160" text-anchor="middle">60%</text>
<line x1="1208.0" y1="170" x2="1208.0" y2="570" stroke="#e2e8f0"/>
<text class="axis" x="1208.0" y="160" text-anchor="middle">80%</text>
<line x1="1410.0" y1="170" x2="1410.0" y2="570" stroke="#e2e8f0"/>
<text class="axis" x="1410.0" y="160" text-anchor="middle">100%</text>
<text class="label" x="60" y="255">Trial 1</text>
<rect x="400" y="225" width="310.8" height="34" rx="5" fill="#0f766e"/>
<rect x="400" y="270" width="0.0" height="34" rx="5" fill="#16a34a"/>
<text class="value" x="720.8" y="248">540/1755 = 30.8%</text>
<text class="value" x="410.0" y="293">0/1755 = 0.0%</text>
<text class="label" x="60" y="380">Trial 2</text>
<rect x="400" y="350" width="757.5" height="34" rx="5" fill="#0f766e"/>
<rect x="400" y="395" width="373.3" height="34" rx="5" fill="#16a34a"/>
<text class="value" x="1167.5" y="373">69/92 = 75.0%</text>
<text class="value" x="783.3" y="418">34/92 = 37.0%</text>
<text class="label" x="60" y="505">Trial 3</text>
<rect x="400" y="475" width="767.9" height="34" rx="5" fill="#0f766e"/>
<rect x="400" y="520" width="297.5" height="34" rx="5" fill="#16a34a"/>
<text class="value" x="1177.9" y="498">111/146 = 76.0%</text>
<text class="value" x="707.5" y="543">43/146 = 29.5%</text>
<text class="source" x="60" y="628">Source: finalized record.json validator and outcome fields</text>
</g>
</svg>
