 .white{font:700 15px system-ui,sans-serif;fill:#fff}
 .source{font:14px system-ui,sans-serif;fill:#64748b}
 </style>
<rect width="1600" height="680" fill="#f8fafc"/>
<text class="title" x="60" y="57">Full-matrix resource profiles</text>
<text class="sub" x="60" y="103">Medians among finalized records; axes are independently scaled by panel</text>
<g transform="translate(0,0)">
