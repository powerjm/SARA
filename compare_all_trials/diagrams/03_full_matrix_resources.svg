<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img">
<title>Full-matrix resource profiles</title>
<style>
 .title{font:700 34px system-ui,sans-serif;fill:#172554}
