<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600" role="img" aria-labelledby="title desc">
  <title id="title">Trial 3 prompting methods: verbatim comparison</title>
  <desc id="desc">Side-by-side verbatim comparison of the template-backward and recon-first prompt modules.</desc>
  <style>
    .title { font: 700 34px system-ui, sans-serif; fill: #172554; }
    .headline { font: 800 31px system-ui, sans-serif; fill: #172554; }
    .sub { font: 18px system-ui, sans-serif; fill: #475569; }
    .section { font: 700 15px system-ui, sans-serif; fill: #64748b; letter-spacing: 1.5px; }
    .label { font: 650 18px system-ui, sans-serif; fill: #1e293b; }
    .small { font: 15px system-ui, sans-serif; fill: #475569; }
    .smalllight { font: 15px system-ui, sans-serif; fill: #dbeafe; }
    .tiny { font: 13px system-ui, sans-serif; fill: #64748b; }
    .value { font: 700 18px system-ui, sans-serif; fill: #172554; }
    .big { font: 800 42px system-ui, sans-serif; fill: #fff; }
    .bigdark { font: 800 42px system-ui, sans-serif; fill: #172554; }
    .white { font: 700 16px system-ui, sans-serif; fill: #fff; }
    .axis { font: 14px system-ui, sans-serif; fill: #64748b; }
    .source { font: 14px system-ui, sans-serif; fill: #64748b; }
    .mono { font: 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #123b4a; }
