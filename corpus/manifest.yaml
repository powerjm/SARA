  - id: cgc-kprca-00091
    name: "DARPA CGC KPRCA_00091 — FailAV malware engine (OOB write via emulator)"
    source_url: "git+https://github.com/trailofbits/cb-multios@810d7b24b1f62f56ef49b148fe155b0d0629cad2"
    build:
      challenge: FailAV  # cb-multios renamed dir for KPRCA_00091 (AUTHOR_ID KPRCA / SERVICE_ID 00091)
    sha256: "2b1b28f25249a79237ad0ef3b541661d73bdd3ae4ea9b1becabd7b9754460329"
    architecture: i386
    protections:
