    # Ordered control-flow targets of corpus/exploits/ropbench-synth-ex005.py
    # (ADR 0003 fingerprint source; uniqueness baseline, not an oracle). Pinned to
    # this build's addresses.
    documented_gadget_addresses:
      - "0x00000000004010ab"   # LoadConstG2: pop rdi ; pop rbp ; ret
      - "0x00000000004010ae"   # StoreMemG:   mov [rdi], rbp ; ret   (plant "/bin/sh")
      - "0x00000000004010a6"   # LoadConstG1: pop rdi ; pop rsi ; pop rdx ; pop rax ; ret
      - "0x00000000004010b2"   # SyscallG:    execve("/bin/sh", 0, 0)
