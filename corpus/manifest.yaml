  - id: cgc-cromu-00046
    name: "DARPA CGC CROMU_00046 — Hug_Game gambling parlor (stack overflow)"
    source_url: "git+https://github.com/trailofbits/cb-multios@810d7b24b1f62f56ef49b148fe155b0d0629cad2"
    build:
      challenge: Hug_Game  # cb-multios renamed dir for CROMU_00046 (AUTHOR_ID CROMU / SERVICE_ID 00046)
