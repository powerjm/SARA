      - "0x00000000004010ca"   # StoreMemG1:  mov [rax], rbx ; ret
      - "0x00000000004010b6"   # LoadConstG6: pop rdi ; ret
      - "0x00000000004010c8"   # LoadConstG8: pop rdx ; ret
