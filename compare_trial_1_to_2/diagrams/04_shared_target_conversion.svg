<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="615" viewBox="0 0 1600 615" role="img">
<title>Shared-target engagement and success</title>
<style>
    .title { font: 700 34px system-ui, sans-serif; fill: #172554; }
    .sub { font: 17px system-ui, sans-serif; fill: #475569; }
    .label { font: 650 17px system-ui, sans-serif; fill: #1e293b; }
    .small { font: 15px system-ui, sans-serif; fill: #64748b; }
    .value { font: 700 15px system-ui, sans-serif; fill: #172554; }
    .legend { font: 15px system-ui, sans-serif; fill: #334155; }
    .axis { font: 14px system-ui, sans-serif; fill: #64748b; }
    .white { font: 700 15px system-ui, sans-serif; fill: #fff; }
    .source { font: 14px system-ui, sans-serif; fill: #64748b; }
  </style>
<rect width="1600" height="615" fill="#f8fafc"/>
<text class="title" x="60" y="57">Shared-target engagement and success</text>
<text class="sub" x="60" y="103">Observed finalized runs in the common-coverage subset: 3 targets × 3 backends × 3 strategies</text>
<g transform="translate(0,0)">
<rect x="770" y="120" width="18" height="18" rx="3" fill="#2563eb"/><text class="legend" x="798" y="135">Trial 1 reached validator</text>
<rect x="1000" y="120" width="18" height="18" rx="3" fill="#0f766e"/><text class="legend" x="1028" y="135">Trial 2 reached validator</text>
<rect x="1240" y="120" width="18" height="18" rx="3" fill="#16a34a"/><text class="legend" x="1268" y="135">Trial 2 success</text>
<line x1="390.0" y1="170" x2="390.0" y2="540" stroke="#e2e8f0"/>
