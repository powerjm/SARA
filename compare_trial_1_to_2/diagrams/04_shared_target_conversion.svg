<text class="axis" x="647.5" y="160" text-anchor="middle">25%</text>
<line x1="905.0" y1="170" x2="905.0" y2="540" stroke="#e2e8f0"/>
<text class="axis" x="905.0" y="160" text-anchor="middle">50%</text>
<line x1="1162.5" y1="170" x2="1162.5" y2="540" stroke="#e2e8f0"/>
<text class="axis" x="1162.5" y="160" text-anchor="middle">75%</text>
<line x1="1420.0" y1="170" x2="1420.0" y2="540" stroke="#e2e8f0"/>
<text class="axis" x="1420.0" y="160" text-anchor="middle">100%</text>
<text class="label" x="60.0" y="235.0" text-anchor="start"><tspan x="60.0" dy="0">BroncoCTF 2026</tspan></text>
<line x1="847.8" y1="230" x2="1305.6" y2="230" stroke="#cbd5e1" stroke-width="5"/>
<circle cx="870.7" cy="230" r="10" fill="#2563eb"/>
<circle cx="1305.6" cy="230" r="10" fill="#0f766e"/>
<circle cx="847.8" cy="230" r="10" fill="#16a34a"/>
<text class="small" x="870.7" y="260" text-anchor="middle">46.7%</text>
<text class="small" x="1305.6" y="212" text-anchor="middle">88.9%</text>
<text class="small" x="847.8" y="282" text-anchor="middle">44.4%</text>
<text class="label" x="60.0" y="340.0" text-anchor="start"><tspan x="60.0" dy="0">CGC CADET 00001</tspan></text>
<line x1="390.0" y1="335" x2="1162.5" y2="335" stroke="#cbd5e1" stroke-width="5"/>
<circle cx="670.9" cy="335" r="10" fill="#2563eb"/>
<circle cx="1162.5" cy="335" r="10" fill="#0f766e"/>
<circle cx="390.0" cy="335" r="10" fill="#16a34a"/>
<text class="small" x="670.9" y="365" text-anchor="middle">27.3%</text>
<text class="small" x="1162.5" y="317" text-anchor="middle">75.0%</text>
<text class="small" x="390.0" y="387" text-anchor="middle">0.0%</text>
<text class="label" x="60.0" y="445.0" text-anchor="start"><tspan x="60.0" dy="0">ROPBench ex005</tspan></text>
<line x1="1076.7" y1="440" x2="1420.0" y2="440" stroke="#cbd5e1" stroke-width="5"/>
<circle cx="1242.4" cy="440" r="10" fill="#2563eb"/>
<circle cx="1420.0" cy="440" r="10" fill="#0f766e"/>
<circle cx="1076.7" cy="440" r="10" fill="#16a34a"/>
<text class="small" x="1242.4" y="470" text-anchor="middle">82.8%</text>
<text class="small" x="1420.0" y="422" text-anchor="middle">100.0%</text>
<text class="small" x="1076.7" y="492" text-anchor="middle">66.7%</text>
