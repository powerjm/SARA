<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="710" viewBox="0 0 1600 710" role="img">
<title>Tool-use composition changed from submission to iteration</title>
<style>
    .title { font: 700 34px system-ui, sans-serif; fill: #172554; }
    .sub { font: 17px system-ui, sans-serif; fill: #475569; }
    .label { font: 650 17px system-ui, sans-serif; fill: #1e293b; }
    .small { font: 15px system-ui, sans-serif; fill: #64748b; }
    .value { font: 700 15px system-ui, sans-serif; fill: #172554; }
    .legend { font: 15px system-ui, sans-serif; fill: #334155; }
    .axis { font: 14px system-ui, sans-serif; fill: #64748b; }
    .white { font: 700 15px system-ui, sans-serif; fill: #fff; }
    .source { font: 14px system-ui, sans-serif; fill: #64748b; }
  </style>
<rect width="1600" height="710" fill="#f8fafc"/>
<text class="title" x="60" y="57">Tool-use composition changed from submission to iteration</text>
<text class="sub" x="60" y="103">Normalized shares of recorded tool calls</text>
<g transform="translate(0,0)">
<rect x="310" y="130" width="18" height="18" rx="3" fill="#2563eb"/>
<text class="legend" x="337" y="145">enumerate</text>
<rect x="555" y="130" width="18" height="18" rx="3" fill="#f59e0b"/>
<text class="legend" x="582" y="145">submit</text>
<rect x="800" y="130" width="18" height="18" rx="3" fill="#16a34a"/>
<text class="legend" x="827" y="145">run script</text>
<rect x="1045" y="130" width="18" height="18" rx="3" fill="#0f766e"/>
<text class="legend" x="1072" y="145">radare2</text>
<rect x="1290" y="130" width="18" height="18" rx="3" fill="#7c3aed"/>
<text class="legend" x="1317" y="145">ropper</text>
<rect x="310" y="164" width="18" height="18" rx="3" fill="#0891b2"/>
<text class="legend" x="337" y="179">ghidra</text>
<rect x="555" y="164" width="18" height="18" rx="3" fill="#64748b"/>
<text class="legend" x="582" y="179">gdb</text>
<rect x="800" y="164" width="18" height="18" rx="3" fill="#db2777"/>
<text class="legend" x="827" y="179">pwntools</text>
<rect x="1045" y="164" width="18" height="18" rx="3" fill="#e2e8f0"/>
<text class="legend" x="1072" y="179">other</text>
<text class="label" x="60" y="315">Trial 1</text>
<rect x="300.0" y="280" width="934.8" height="62" fill="#2563eb"/>
<text class="white" x="767.4" y="308" text-anchor="middle">enumerate</text>
<text class="white" x="767.4" y="329" text-anchor="middle">79.2%</text>
<rect x="1234.8" y="280" width="245.2" height="62" fill="#f59e0b"/>
<text class="white" x="1357.4" y="308" text-anchor="middle">submit</text>
<text class="white" x="1357.4" y="329" text-anchor="middle">20.8%</text>
<text class="small" x="300" y="368">32,070 recorded tool calls</text>
<text class="label" x="60" y="480">Trial 2</text>
<rect x="300.0" y="445" width="226.0" height="62" fill="#2563eb"/>
<text class="white" x="413.0" y="473" text-anchor="middle">enumerate</text>
<text class="white" x="413.0" y="494" text-anchor="middle">19.2%</text>
<rect x="526.0" y="445" width="11.0" height="62" fill="#f59e0b"/>
<rect x="537.0" y="445" width="155.4" height="62" fill="#16a34a"/>
<text class="white" x="614.7" y="473" text-anchor="middle">run script</text>
<text class="white" x="614.7" y="494" text-anchor="middle">13.2%</text>
<rect x="692.4" y="445" width="431.5" height="62" fill="#0f766e"/>
<text class="white" x="908.1" y="473" text-anchor="middle">radare2</text>
<text class="white" x="908.1" y="494" text-anchor="middle">36.6%</text>
<rect x="1123.9" y="445" width="143.5" height="62" fill="#7c3aed"/>
<text class="white" x="1195.6" y="473" text-anchor="middle">ropper</text>
<text class="white" x="1195.6" y="494" text-anchor="middle">12.2%</text>
<rect x="1267.4" y="445" width="103.9" height="62" fill="#0891b2"/>
<text class="white" x="1319.3" y="473" text-anchor="middle">ghidra</text>
<text class="white" x="1319.3" y="494" text-anchor="middle">8.8%</text>
<rect x="1371.3" y="445" width="58.6" height="62" fill="#64748b"/>
<rect x="1429.9" y="445" width="50.1" height="62" fill="#db2777"/>
<text class="small" x="300" y="533">2,475 recorded tool calls</text>
<rect x="60" y="585" width="1420" height="65" rx="12" fill="#e0f2fe"/>
<text class="small" x="84" y="613">Trial 1 exposed only enumerate_gadgets and submit_payload. Trial 2 redistributed calls across analysis,</text>
<text class="small" x="84" y="637">script execution, disassembly, gadget search, decompilation, and debugging tools.</text>
<text class="source" x="60" y="688">Source: Trial 1 tool-use report and Trial 2 RunRecord tool_call_counts</text>
</g>
</svg>
