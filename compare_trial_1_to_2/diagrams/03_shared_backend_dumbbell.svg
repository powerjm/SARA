<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="615" viewBox="0 0 1600 615" role="img">
<title>Shared-backend engagement and success</title>
<style>
    .title { font: 700 34px system-ui, sans-serif; fill: #172554; }
    .sub { font: 17px system-ui, sans-serif; fill: #475569; }
    .label { font: 650 17px system-ui, sans-serif; fill: #1e293b; }
    .small { font: 15px system-ui, sans-serif; fill: #64748b; }
    .value { font: 700 15px system-ui, sans-serif; fill: #172554; }
    .legend { font: 15px system-ui, sans-serif; fill: #334155; }
    .axis { font: 14px system-ui, sans-serif; fill: #64748b; }
    .white { font: 700 15px system-ui, sans-serif; fill: #fff; }
    .source { font: 14px system-ui, sans-serif; fill: #64748b; }
  </style>
<rect width="1600" height="615" fill="#f8fafc"/>
<text class="title" x="60" y="57">Shared-backend engagement and success</text>
<text class="sub" x="60" y="103">Observed finalized runs in the common-coverage subset: 3 targets × 3 backends × 3 strategies</text>
<g transform="translate(0,0)">
<rect x="770" y="120" width="18" height="18" rx="3" fill="#2563eb"/><text class="legend" x="798" y="135">Trial 1 reached validator</text>
<rect x="1000" y="120" width="18" height="18" rx="3" fill="#0f766e"/><text class="legend" x="1028" y="135">Trial 2 reached validator</text>
<rect x="1240" y="120" width="18" height="18" rx="3" fill="#16a34a"/><text class="legend" x="1268" y="135">Trial 2 success</text>
<line x1="390.0" y1="170" x2="390.0" y2="540" stroke="#e2e8f0"/>
<text class="axis" x="390.0" y="160" text-anchor="middle">0%</text>
<line x1="647.5" y1="170" x2="647.5" y2="540" stroke="#e2e8f0"/>
<text class="axis" x="647.5" y="160" text-anchor="middle">25%</text>
<line x1="905.0" y1="170" x2="905.0" y2="540" stroke="#e2e8f0"/>
<text class="axis" x="905.0" y="160" text-anchor="middle">50%</text>
<line x1="1162.5" y1="170" x2="1162.5" y2="540" stroke="#e2e8f0"/>
<text class="axis" x="1162.5" y="160" text-anchor="middle">75%</text>
<line x1="1420.0" y1="170" x2="1420.0" y2="540" stroke="#e2e8f0"/>
<text class="axis" x="1420.0" y="160" text-anchor="middle">100%</text>
<text class="label" x="60.0" y="235.0" text-anchor="start"><tspan x="60.0" dy="0">Claude Sonnet</tspan></text>
<line x1="935.3" y1="230" x2="1359.4" y2="230" stroke="#cbd5e1" stroke-width="5"/>
<circle cx="1145.3" cy="230" r="10" fill="#2563eb"/>
<circle cx="1359.4" cy="230" r="10" fill="#0f766e"/>
<circle cx="935.3" cy="230" r="10" fill="#16a34a"/>
<text class="small" x="1145.3" y="260" text-anchor="middle">73.3%</text>
<text class="small" x="1359.4" y="212" text-anchor="middle">94.1%</text>
<text class="small" x="935.3" y="282" text-anchor="middle">52.9%</text>
<text class="label" x="60.0" y="340.0" text-anchor="start"><tspan x="60.0" dy="0">GPT-5</tspan></text>
<line x1="995.9" y1="335" x2="1298.8" y2="335" stroke="#cbd5e1" stroke-width="5"/>
<circle cx="998.6" cy="335" r="10" fill="#2563eb"/>
<circle cx="1298.8" cy="335" r="10" fill="#0f766e"/>
<circle cx="995.9" cy="335" r="10" fill="#16a34a"/>
<text class="small" x="998.6" y="365" text-anchor="middle">59.1%</text>
<text class="small" x="1298.8" y="317" text-anchor="middle">88.2%</text>
<text class="small" x="995.9" y="387" text-anchor="middle">58.8%</text>
<text class="label" x="60.0" y="445.0" text-anchor="start"><tspan x="60.0" dy="0">GPT-OSS 20B</tspan></text>
<line x1="447.2" y1="440" x2="1248.3" y2="440" stroke="#cbd5e1" stroke-width="5"/>
<circle cx="600.7" cy="440" r="10" fill="#2563eb"/>
<circle cx="1248.3" cy="440" r="10" fill="#0f766e"/>
<circle cx="447.2" cy="440" r="10" fill="#16a34a"/>
<text class="small" x="600.7" y="470" text-anchor="middle">20.5%</text>
<text class="small" x="1248.3" y="422" text-anchor="middle">83.3%</text>
<text class="small" x="447.2" y="492" text-anchor="middle">5.6%</text>
<text class="source" x="60" y="593">Source: record.json metadata; Trial 1 used five replicates and Trial 2 used two</text>
</g>
</svg>
