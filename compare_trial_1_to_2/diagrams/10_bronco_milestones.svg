<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img">
<title>BroncoCTF milestone progression</title>
<style>
    .title { font: 700 34px system-ui, sans-serif; fill: #172554; }
    .sub { font: 17px system-ui, sans-serif; fill: #475569; }
    .label { font: 650 17px system-ui, sans-serif; fill: #1e293b; }
    .small { font: 15px system-ui, sans-serif; fill: #64748b; }
    .value { font: 700 15px system-ui, sans-serif; fill: #172554; }
    .legend { font: 15px system-ui, sans-serif; fill: #334155; }
    .axis { font: 14px system-ui, sans-serif; fill: #64748b; }
    .white { font: 700 15px system-ui, sans-serif; fill: #fff; }
    .source { font: 14px system-ui, sans-serif; fill: #64748b; }
  </style>
<rect width="1600" height="700" fill="#f8fafc"/>
<text class="title" x="60" y="57">BroncoCTF milestone progression</text>
<text class="sub" x="60" y="103">Cumulative milestone shares within each trial’s finalized BroncoCTF runs</text>
<g transform="translate(0,0)">
<rect x="900" y="120" width="18" height="18" rx="3" fill="#2563eb"/><text class="legend" x="928" y="135">Trial 1</text>
<rect x="1070" y="120" width="18" height="18" rx="3" fill="#16a34a"/><text class="legend" x="1098" y="135">Trial 2</text>
<line x1="380.0" y1="175" x2="380.0" y2="510" stroke="#e2e8f0"/>
<text class="axis" x="380.0" y="165" text-anchor="middle">0%</text>
<line x1="586.0" y1="175" x2="586.0" y2="510" stroke="#e2e8f0"/>
<text class="axis" x="586.0" y="165" text-anchor="middle">20%</text>
<line x1="792.0" y1="175" x2="792.0" y2="510" stroke="#e2e8f0"/>
<text class="axis" x="792.0" y="165" text-anchor="middle">40%</text>
<line x1="998.0" y1="175" x2="998.0" y2="510" stroke="#e2e8f0"/>
<text class="axis" x="998.0" y="165" text-anchor="middle">60%</text>
<line x1="1204.0" y1="175" x2="1204.0" y2="510" stroke="#e2e8f0"/>
<text class="axis" x="1204.0" y="165" text-anchor="middle">80%</text>
<line x1="1410.0" y1="175" x2="1410.0" y2="510" stroke="#e2e8f0"/>
<text class="axis" x="1410.0" y="165" text-anchor="middle">100%</text>
<text class="label" x="60" y="263">Gate 1+</text>
<rect x="380" y="235" width="63.4" height="32" rx="5" fill="#2563eb"/>
<rect x="380" y="279" width="629.4" height="32" rx="5" fill="#16a34a"/>
<text class="value" x="453.4" y="257">12/195 = 6.2%</text>
<text class="value" x="1019.4" y="301">11/18 = 61.1%</text>
<text class="label" x="60" y="373">Later gate+</text>
<rect x="380" y="345" width="21.1" height="32" rx="5" fill="#2563eb"/>
<rect x="380" y="389" width="572.2" height="32" rx="5" fill="#16a34a"/>
<text class="value" x="411.1" y="367">4/195 = 2.1%</text>
<text class="value" x="962.2" y="411">10/18 = 55.6%</text>
<text class="label" x="60" y="483">MARKER</text>
<rect x="380" y="455" width="0.0" height="32" rx="5" fill="#2563eb"/>
<rect x="380" y="499" width="457.8" height="32" rx="5" fill="#16a34a"/>
<text class="value" x="390.0" y="477">0/195 = 0.0%</text>
<text class="value" x="847.8" y="521">8/18 = 44.4%</text>
<rect x="60" y="555" width="1420" height="82" rx="12" fill="#fef3c7"/>
<text class="small" x="84" y="584">Trial 1 milestones use within-run trajectory evidence (Gate 1 any=12; clean Gate 2 path=4).</text>
<text class="small" x="84" y="609">Trial 2 uses retained final-record stdout (Gate 1+=11; Gate 3+=10; marker=8). The rates are descriptive,</text>
<text class="small" x="84" y="632">not a measurement-identical longitudinal series.</text>
<text class="source" x="60" y="678">Source: Trial 1 trajectory analysis and Trial 2 retained validator stdout</text>
</g>
</svg>
