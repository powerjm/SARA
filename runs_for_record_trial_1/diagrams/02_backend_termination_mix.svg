<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Termination mix by backend</title>
  <desc id="desc">Normalized stacked bars show budget exhaustion, truncation, and refusal for each backend's finalized runs. No backend recorded a success.</desc>
  <style>
    .title { font: 700 34px system-ui, sans-serif; fill: #172554; }
    .sub { font: 18px system-ui, sans-serif; fill: #475569; }
    .name { font: 600 17px system-ui, sans-serif; fill: #1e293b; }
    .meta { font: 15px system-ui, sans-serif; fill: #475569; }
    .axis { font: 14px system-ui, sans-serif; fill: #64748b; }
    .legend { font: 16px system-ui, sans-serif; fill: #334155; }
    .section { font: 700 15px system-ui, sans-serif; fill: #64748b; letter-spacing: 1.5px; }
    .source { font: 14px system-ui, sans-serif; fill: #64748b; }
  </style>
  <rect width="1400" height="980" fill="#f8fafc"/>
  <text class="title" x="55" y="58">How finalized runs ended, by backend</text>
  <text class="sub" x="55" y="91">Bars are normalized within backend; “payload” is the share with a stored executable candidate</text>

  <rect x="850" y="35" width="18" height="18" rx="3" fill="#2563eb"/><text class="legend" x="878" y="50">budget exhausted</text>
  <rect x="1040" y="35" width="18" height="18" rx="3" fill="#f59e0b"/><text class="legend" x="1068" y="50">truncated</text>
  <rect x="1180" y="35" width="18" height="18" rx="3" fill="#dc2626"/><text class="legend" x="1208" y="50">refusal</text>

  <text class="axis" x="355" y="126">0%</text><text class="axis" x="742" y="126">50%</text><text class="axis" x="1130" y="126">100%</text>
  <line x1="360" y1="135" x2="360" y2="917" stroke="#cbd5e1"/>
  <line x1="750" y1="135" x2="750" y2="917" stroke="#e2e8f0"/>
  <line x1="1140" y1="135" x2="1140" y2="917" stroke="#cbd5e1"/>

  <text class="section" x="55" y="158">PREMIUM</text>
  <text class="name" x="55" y="199">Claude Opus</text>
  <rect x="360" y="177" width="666" height="30" rx="5" fill="#2563eb"/><rect x="1026" y="177" width="114" height="30" rx="5" fill="#dc2626"/>
  <text class="meta" x="1160" y="199">n=75 • payload 90.7%</text>

  <text class="name" x="55" y="252">Claude Sonnet</text>
  <rect x="360" y="230" width="722" height="30" rx="5" fill="#2563eb"/><rect x="1082" y="230" width="58" height="30" rx="5" fill="#f59e0b"/>
  <text class="meta" x="1160" y="252">n=95 • payload 65.3%</text>

  <text class="name" x="55" y="305">Gemini Pro</text>
  <rect x="360" y="283" width="24" height="30" rx="5" fill="#2563eb"/><rect x="384" y="283" width="756" height="30" rx="5" fill="#dc2626"/>
  <text class="meta" x="1160" y="305">n=195 • payload 16.4%</text>

  <text class="name" x="55" y="358">GPT-5</text>
  <rect x="360" y="336" width="780" height="30" rx="5" fill="#2563eb"/>
  <text class="meta" x="1160" y="358">n=188 • payload 69.1%</text>

  <text class="section" x="55" y="414">OPEN WEIGHT</text>
  <text class="name" x="55" y="455">Devstral Small</text>
  <rect x="360" y="433" width="700" height="30" rx="5" fill="#2563eb"/><rect x="1060" y="433" width="80" height="30" rx="5" fill="#f59e0b"/>
  <text class="meta" x="1160" y="455">n=147 • payload 12.2%</text>

  <text class="name" x="55" y="508">GPT-OSS 20B</text>
  <rect x="360" y="486" width="328" height="30" rx="5" fill="#2563eb"/><rect x="688" y="486" width="452" height="30" rx="5" fill="#f59e0b"/>
  <text class="meta" x="1160" y="508">n=174 • payload 20.7%</text>

  <text class="name" x="55" y="561">Qwen2.5 Coder 32B</text>
  <rect x="360" y="539" width="217" height="30" rx="5" fill="#2563eb"/><rect x="577" y="539" width="563" height="30" rx="5" fill="#f59e0b"/>
  <text class="meta" x="1160" y="561">n=180 • payload 3.3%</text>

  <text class="name" x="55" y="614">Qwen3 Coder 30B</text>
  <rect x="360" y="592" width="601" height="30" rx="5" fill="#2563eb"/><rect x="961" y="592" width="179" height="30" rx="5" fill="#f59e0b"/>
  <text class="meta" x="1160" y="614">n=161 • payload 28.0%</text>

  <text class="section" x="55" y="670">UNRESTRICTED</text>
  <text class="name" x="55" y="711">Dolphin Mistral 24B</text>
  <rect x="360" y="689" width="572" height="30" rx="5" fill="#2563eb"/><rect x="932" y="689" width="208" height="30" rx="5" fill="#f59e0b"/>
  <text class="meta" x="1160" y="711">n=180 • payload 0.0%</text>

  <text class="name" x="55" y="764">Qwen3 30B Abliterated</text>
  <rect x="360" y="742" width="212" height="30" rx="5" fill="#2563eb"/><rect x="572" y="742" width="568" height="30" rx="5" fill="#f59e0b"/>
  <text class="meta" x="1160" y="764">n=180 • payload 73.3%</text>

  <text class="name" x="55" y="817">WhiteRabbitNeo 7B</text>
  <rect x="360" y="795" width="750" height="30" rx="5" fill="#2563eb"/><rect x="1110" y="795" width="30" height="30" rx="5" fill="#f59e0b"/>
  <text class="meta" x="1160" y="817">n=180 • payload 6.1%</text>

  <rect x="55" y="860" width="1285" height="65" rx="12" fill="#fee2e2"/>
  <text class="name" x="80" y="888" fill="#991b1b">Primary endpoint: 0 successful validator outcomes across every backend.</text>
  <text class="meta" x="80" y="912">“Other” in record.json is shown as truncation because every one of the 476 OTHER records ended with termination_reason=truncated.</text>
  <text class="source" x="55" y="958">Source: 1,755 finalized record.json and trace.jsonl artifacts</text>
</svg>
