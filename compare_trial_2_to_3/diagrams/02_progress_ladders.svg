<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="730" viewBox="0 0 1600 730" role="img">
<title>Progress ladders remained comparable, but conversion weakened</title>
<style>
    .title { font: 700 34px system-ui, sans-serif; fill: #172554; }
    .sub { font: 17px system-ui, sans-serif; fill: #475569; }
    .label { font: 650 17px system-ui, sans-serif; fill: #1e293b; }
    .small { font: 15px system-ui, sans-serif; fill: #64748b; }
    .value { font: 700 15px system-ui, sans-serif; fill: #172554; }
    .legend { font: 15px system-ui, sans-serif; fill: #334155; }
    .axis { font: 14px system-ui, sans-serif; fill: #64748b; }
    .white { font: 700 15px system-ui, sans-serif; fill: #fff; }
    .source { font: 14px system-ui, sans-serif; fill: #64748b; }
  </style>
<rect width="1600" height="730" fill="#f8fafc"/>
<text class="title" x="60" y="57">Progress ladders remained comparable, but conversion weakened</text>
<text class="sub" x="60" y="103">Mutually exclusive maximum tiers in schema v5 (Trial 2) and v6 (Trial 3)</text>
<g transform="translate(0,0)">
<text class="label" x="60" y="272">Trial 2 · n=92</text>
<rect x="340.0" y="235" width="280.0" height="64" fill="#e2e8f0"/>
<text class="value" x="480.0" y="264" text-anchor="middle">NONE</text>
<text class="value" x="480.0" y="285" text-anchor="middle">23 · 25.0%</text>
<rect x="620.0" y="235" width="413.9" height="64" fill="#2563eb"/>
<text class="white" x="827.0" y="264" text-anchor="middle">RAN</text>
<text class="white" x="827.0" y="285" text-anchor="middle">34 · 37.0%</text>
<rect x="1033.9" y="235" width="12.2" height="64" fill="#f59e0b"/>
<rect x="1046.1" y="235" width="413.9" height="64" fill="#16a34a"/>
<text class="white" x="1253.0" y="264" text-anchor="middle">MARKER</text>
<text class="white" x="1253.0" y="285" text-anchor="middle">34 · 37.0%</text>
<text class="small" x="340" y="326">Validator/RAN+ 69/92 (75.0%) · marker 34/92 (37.0%)</text>
<text class="label" x="60" y="462">Trial 3 · n=146</text>
<rect x="340.0" y="425" width="268.5" height="64" fill="#e2e8f0"/>
<text class="value" x="474.2" y="454" text-anchor="middle">NONE</text>
<text class="value" x="474.2" y="475" text-anchor="middle">35 · 24.0%</text>
<rect x="608.5" y="425" width="483.3" height="64" fill="#2563eb"/>
<text class="white" x="850.1" y="454" text-anchor="middle">RAN</text>
<text class="white" x="850.1" y="475" text-anchor="middle">63 · 43.2%</text>
<rect x="1091.8" y="425" width="38.4" height="64" fill="#f59e0b"/>
<rect x="1130.1" y="425" width="329.9" height="64" fill="#16a34a"/>
<text class="white" x="1295.1" y="454" text-anchor="middle">MARKER</text>
<text class="white" x="1295.1" y="475" text-anchor="middle">43 · 29.5%</text>
<text class="small" x="340" y="516">Validator/RAN+ 111/146 (76.0%) · marker 43/146 (29.5%)</text>
<rect x="60" y="590" width="1420" height="78" rx="12" fill="#e0f2fe"/>
<text class="small" x="84" y="620">Validator reach was nearly unchanged (75.0% → 76.0%), while marker success fell (37.0% → 29.5%).</text>
<text class="small" x="84" y="646">Trial 3 has four refusal outcomes overlaid on 2 NONE and 2 RAN tiers; they are not a fifth tier.</text>
<text class="source" x="60" y="708">Source: finalized max_tier_reached and validator fields</text>
</g>
</svg>
